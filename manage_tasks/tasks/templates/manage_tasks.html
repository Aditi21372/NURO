<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Tasks</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">

</head>
<body>
    <h1>Manage Tasks</h1>

    <form method="POST" action="{% url 'manage_task' %}">

        {% csrf_token %}
        <input type="text" name="task_name" placeholder="Enter task name" required>
        <button type="submit">Add Task</button>
    </form>

    {% if success %}
        <p>{{ success }}</p>
    {% endif %}

    <h2>Existing Tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>{{ task.title }}</li>
        {% endfor %}
    </ul>
</body>
</html>
